name: Swift package tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: swift test --disable-automatic-resolution --jobs 2
      - run: git diff --exit-code -- Package.swift Package.resolved Sources Tests
